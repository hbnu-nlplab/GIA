# =============================================================================
# 모델 설정 파일
# - vLLM/OpenAI endpoint 별 모델 정의
# - 모델별 context length, GPU 설정 등
# =============================================================================


"Mistral3-8B": "mistralai/Ministral-3-8B-Instruct-2512",
        "Qwen3-8B": "Qwen/Qwen3-8B",
        "GPT-OSS-20B": "openai/gpt-oss-20b",
        "LLlama-3.1": "meta-llama/Meta-Llama-3.1-8B-Instruct",
    

# vLLM 모델 (로컬 GPU)
vllm_models:
  Mistral3-8B:
    path: "mistralai/Ministral-3-8B-Instruct-2512"
    context_length: 32768
    gpu_memory_utilization: 0.85
    tensor_parallel_size: 1
    
  Qwen3-8B:
    path: "Qwen/Qwen3-8B"
    context_length: 32768
    gpu_memory_utilization: 0.85
    tensor_parallel_size: 1
    
  Llama-3.1-8B:
    path: "meta-llama/Meta-Llama-3.1-8B-Instruct"
    context_length: 32786
    gpu_memory_utilization: 0.85
    tensor_parallel_size: 1
    
  GPT-OSS-20B:
    path: openai/gpt-oss-20b"
    context_length: 32786
    gpu_memory_utilization: 0.85
    tensor_parallel_size: 1

# OpenAI API 모델
openai_models:
  gpt-4o-mini:
    model_id: "gpt-4o-mini"
    context_length: 128000
    
  gpt-4o:
    model_id: "gpt-4o"
    context_length: 128000
    
  gpt-4-turbo:
    model_id: "gpt-5-mini"
    context_length: 128000

# 기본 설정
defaults:
  dtype: "auto"
  trust_remote_code: true
  # 컨텍스트가 초과할 경우 트렁케이션 사용 (스킵 금지)
  truncation_strategy: "truncate_context"  # 'truncate_context' | 'error'

# =============================================================================
# Structured Output (vLLM Guided Generation) 설정
# =============================================================================
# vLLM은 guided_decoding 파라미터로 JSON schema 기반 출력을 강제할 수 있음
# 
# 언제 사용?
# - TeleQnA (객관식): 유용할 수 있음 (option 번호만 뽑으면 됨)
#   → 하지만 대부분 모델이 프롬프트만으로 잘 따라옴
#   → 파싱 오류가 많을 때만 켜는 것 권장
#
# - TeleQuAD (추출형): 불필요 (자유 텍스트 추출)
# - NetBench (자유형): 불필요 (긴 설명/설정 출력)
#
# 사용법: 각 데이터셋 모듈의 sampling_config.use_structured_output = True 설정
# =============================================================================
structured_output:
  # TeleQnA용 설정 (기본 비활성화)
  teleqna:
    enabled: false  # True로 변경 시 JSON 응답 강제
    description: "객관식 - option 번호만 추출하면 되므로 선택적 사용"
    
  # TeleQuAD/NetBench는 structured output 불필요
  telequad:
    enabled: false
    description: "추출형 QA - 자유 텍스트이므로 사용 안 함"
    
  netbench:
    enabled: false
    description: "자유형 QA - 긴 설명/설정 출력이므로 사용 안 함"
