# =============================================================================
# 실험 설정 파일
# - seed, 반복 횟수, 출력 폴더 등
# =============================================================================

# 재현성 설정
seed: 42
num_runs: 1  # 반복 횟수 (여러 번 실행 시 평균 계산용)

# 디렉토리 설정
paths:
  data_dir: "data"
  result_dir: "Result/external_dataset"
  log_dir: "logs"
  
# 데이터셋 경로 (Experiment 폴더 기준 상대경로)
datasets:
  teleqna:
    path: "data/TeleQnA/TeleQnA.json"
    enabled: true
    description: "10,000 multiple-choice questions for telecom knowledge"
    
  telequad:
    path: "data/TeleQuAD/TeleQuAD-v4-full.json"
    enabled: true
    description: "4,485 QA pairs from 3GPP and ShareTechNote"
    
  netbench:
    path: "data/NetBench/T-NetEval.csv"
    enabled: true
    description: "5,390 expert-level QA across 20 telecom categories"

# 배치 설정
batch:
  # vLLM은 자체 배치 최적화 사용
  use_vllm_batching: true
  # OpenAI API 배치 크기
  openai_batch_size: 10
  # 진행률 로깅 간격
  log_interval: 100

# 평가 설정
evaluation:
  # 동일 문항 비교를 위해 평가된 문항 ID 저장
  save_evaluated_ids: true
  # 교집합 문항으로만 비교 리포트 생성
  intersection_comparison: true
  
# 로깅 설정
logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)s | %(message)s"
  save_to_file: true
