!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname TestRouter
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
ip cef
!
!
!
!
!
!
!
!
!
!
mpls ldp
!
!
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
interface Serial0/0
 description WAN_LINK_TO_HQ
 ip address 10.0.0.1 255.255.255.252
 serial restart-delay 0
!
interface GigabitEthernet0/0
 description LAN_LINK
 ip address 192.168.1.1 255.255.255.0
 duplex auto
 speed auto
!
interface GigabitEthernet0/1.10
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
!
router ospf 100
 router-id 1.1.1.1
 network 1.1.1.1 0.0.0.0 area 0
 network 10.0.0.0 0.0.0.3 area 1
!
router rip
 version 2
 network 192.168.1.0
 no auto-summary
!
router bgp 65001
 bgp log-neighbor-changes
 neighbor 10.0.0.2 remote-as 65002
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
ip route 0.0.0.0 0.0.0.0 10.0.0.2
ip route 172.16.0.0 255.255.0.0 Null0
!
ip prefix-list TEST_PREFIX seq 5 permit 10.0.0.0/8
ip prefix-list TEST_PREFIX seq 10 deny 0.0.0.0/0
!
route-map TEST_MAP permit 10
 match ip address prefix-list TEST_PREFIX
 set metric 100
!
access-list 10 permit 192.168.1.0 0.0.0.255
!
ip access-list extended ACL_EXT
 permit tcp any any eq 80
!
snmp-server community public RO
!
control-plane
!
!
line con 0
 exec-timeout 0 0
line aux 0
line vty 0 4
 login
 transport input none
!
!
end
