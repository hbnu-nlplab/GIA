
!
! Config Generated by GIA Config Generator
! Topology: National Converged Network (국가 통합 통신망) - 40 Nodes Multi-AS Complex Scenario
! Role: Autonomous System Boundary Router (ASBR)
!
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname ASBR2
!
boot-start-marker
boot-end-marker
!

!
aaa new-model
aaa authentication login default local
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
no ip domain lookup
ip domain name ncn.go.kr
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
mpls label protocol ldp
!
!
username admin privilege 15 secret admin
!
redundancy
!


ip prefix-list DENY_DEFAULT seq 5 deny 0.0.0.0/0


ip prefix-list DENY_DEFAULT seq 10 permit 0.0.0.0/0 le 32


!



route-map FILTER_EBGP permit 10

 match ip address prefix-list DENY_DEFAULT

!


!
interface Loopback0
 ip address 10.255.0.32 255.255.255.255
!

interface GigabitEthernet0/0

 ip address 10.0.30.3 255.255.255.254

 description Inter-AS link to Region2 P8

 duplex auto
 speed auto
 media-type rj45

 mpls ip

!

interface GigabitEthernet0/1

 ip address 10.0.32.0 255.255.255.254

 duplex auto
 speed auto
 media-type rj45

 mpls ip

!

interface GigabitEthernet0/2

 ip address 10.0.32.2 255.255.255.254

 duplex auto
 speed auto
 media-type rj45

 mpls ip

!

interface GigabitEthernet0/3

 ip address 10.0.40.2 255.255.255.254

 description Inter-Region Backbone (Region3 ↔ Region4)

 duplex auto
 speed auto
 media-type rj45

 mpls ip

!

!
! Management Interface (OOB)
interface GigabitEthernet0/7
 ip address 10.10.10.42 255.255.255.0
 duplex auto
 speed auto
 media-type rj45
!
router ospf 1
 router-id 10.255.0.32

 ! ASBR: Loopback in Area 0 (backbone connectivity)
 network 10.255.0.32 0.0.0.0 area 0
 
  
 network 10.0.30.2 0.0.0.1 area 0
  
 
  
 network 10.0.32.0 0.0.0.1 area 1
  
 
  
 network 10.0.32.2 0.0.0.1 area 1
  
 
  
 network 10.0.40.2 0.0.0.1 area 2
  
 

!
router bgp 65001
 bgp log-neighbor-changes

 neighbor 10.0.30.2 remote-as 65000

 neighbor 10.0.30.2 ebgp-multihop 2


 neighbor 10.0.30.2 next-hop-self


 neighbor 10.0.30.2 route-map FILTER_EBGP in


 neighbor 10.0.40.3 remote-as 65002

 neighbor 10.0.40.3 ebgp-multihop 2


 neighbor 10.0.40.3 next-hop-self



 neighbor 10.255.0.33 remote-as 65001

 neighbor 10.255.0.33 update-source Loopback0




 neighbor 10.255.0.34 remote-as 65001

 neighbor 10.255.0.34 update-source Loopback0




 neighbor 10.255.0.31 remote-as 65001

 neighbor 10.255.0.31 update-source Loopback0




 !
 address-family vpnv4

  neighbor 10.0.30.2 activate
  neighbor 10.0.30.2 send-community both

  neighbor 10.0.30.2 next-hop-self


  neighbor 10.0.40.3 activate
  neighbor 10.0.40.3 send-community both

  neighbor 10.0.40.3 next-hop-self


  neighbor 10.255.0.33 activate
  neighbor 10.255.0.33 send-community both


  neighbor 10.255.0.34 activate
  neighbor 10.255.0.34 send-community both


  neighbor 10.255.0.31 activate
  neighbor 10.255.0.31 send-community both


 exit-address-family
 !

!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
! NTP Configuration
ntp server 10.10.10.1
!
! Syslog Configuration
logging host 10.10.10.1
logging buffered 51200 warnings
!
! SNMP Configuration
snmp-server community NCN-RO RO
snmp-server community NCN-RW RW
!
! Management Gateway

ip route 0.0.0.0 0.0.0.0 10.10.10.1

!
ip ssh version 2
!
! Timezone
clock timezone KST 9 0
!
! Banner
banner motd ^
*** NCN ASBR ASBR2 - Inter-AS Gateway ***
*** Authorized Access Only - All activities are monitored ***
^
!
mpls ldp router-id Loopback0 force
!
control-plane
!
line con 0
line aux 0
line vty 0 4
 login local
 transport input ssh
!
no scheduler allocate
!
end
