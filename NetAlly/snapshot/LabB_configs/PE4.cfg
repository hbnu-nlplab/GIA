  version         15.9
  service timestamps debug datetime msec
  service timestamps log datetime msec
  service password-encryption
  vrf definition VRF_EDU
   rd 65000:200
   route-target export 65000:200
   route-target import 65000:200
   address-family ipv4
    exit-address-family
   !
  !
  vrf definition VRF_GOV
   rd 65000:100
   route-target export 65000:100
   route-target import 65000:100
   address-family ipv4
    exit-address-family
   !
  !
  vrf definition VRF_RND
   rd 65000:300
   route-target export 65000:300
   route-target import 65000:300
   address-family ipv4
    exit-address-family
   !
  !
  clock timezone KST 9 0
  no cable admission-control preempt priority-voice
  no cable qos permission create
  no cable qos permission update
  no cable qos permission modems
  ip cef
  no ip domain lookup
  ip domain name ncn.go.kr
  ip ssh version 2
  ip forward-protocol nd
  no ip http server
  no ip http secure-server
  ip route 0.0.0.0 0.0.0.0 10.10.10.1
  no ipv6 cef
  multilink bundle-name authenticated
  username admin privilege 15 secret 9 $14$1TT7$5gyK3Nvlq2/Xzk$6LqXip.fvt4Qd0DxSSxqUSKahBx5ZNrPOlcvfjqaGhQ
  redundancy
  exit
  no dot11 syslog
  interface Loopback0
   ip address 10.255.0.22 255.255.255.255
   no shutdown
  exit
  interface GigabitEthernet0/0
   no switchport
   media-type rj45
   speed      auto
   duplex     auto
   mpls ip
   ip address 10.0.14.1 255.255.255.254
   no shutdown
  exit
  interface GigabitEthernet0/1
   no switchport
   media-type rj45
   speed      auto
   duplex     auto
   mpls ip
   ip address 10.0.17.1 255.255.255.254
   no shutdown
  exit
  interface GigabitEthernet0/2
   no switchport
   media-type rj45
   speed      auto
   duplex     auto
   vrf forwarding VRF_RND
   ip address 172.17.3.1 255.255.255.0
   no shutdown
  exit
  interface GigabitEthernet0/3
   no switchport
   media-type rj45
   speed      auto
   duplex     auto
   vrf forwarding VRF_GOV
   ip address 172.17.4.1 255.255.255.0
   no shutdown
  exit
  interface GigabitEthernet0/4
   no switchport
   media-type rj45
   speed      auto
   duplex     auto
   no ip address
   shutdown
  exit
  interface GigabitEthernet0/5
   no switchport
   media-type rj45
   speed      auto
   duplex     auto
   no ip address
   shutdown
  exit
  interface GigabitEthernet0/6
   no switchport
   media-type rj45
   speed      auto
   duplex     auto
   no ip address
   shutdown
  exit
  interface GigabitEthernet0/7
   no switchport
   media-type rj45
   speed      auto
   duplex     auto
   ip address 10.10.10.24 255.255.255.0
   no shutdown
  exit