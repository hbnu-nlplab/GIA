name: netally-ci

on:
  pull_request:
    paths:
      - "NetAlly/**"
      - ".github/workflows/netally-ci.yml"
  push:
    branches:
      - main
    paths:
      - "NetAlly/**"
      - ".github/workflows/netally-ci.yml"

env:
  LANGSMITH_TRACING: "false"
  NETALLY_TOOL_BACKEND: "mcp"
  NETALLY_MCP_ALLOW_MUTATIONS: "false"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NetAlly
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run backend tests
        run: uv run pytest -q tests

  frontend-e2e-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NetAlly/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: NetAlly/frontend/package-lock.json

      - name: Sync backend dependencies
        working-directory: NetAlly
        run: uv sync --extra dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run frontend E2E smoke
        run: npm run test:e2e
