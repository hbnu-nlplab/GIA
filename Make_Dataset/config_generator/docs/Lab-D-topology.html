<!DOCTYPE html>

<title>Lab-D PNETLab Wiring Diagram</title>

:root{--bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#334155;--dim:#64748b;--blue:#3b82f6;--purple:#8b5cf6;--amber:#f59e0b;--red:#ef4444;--teal:#14b8a6;--green:#10b981;--cyan:#06b6d4;--orange:#f97316;--pink:#ec4899}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Inter','Segoe UI',system-ui,sans-serif;color:var(--text);overflow-x:hidden}
.header{text-align:center;padding:16px 20px 0}
.header h1{font-size:20px;color:#0f172a;font-weight:700;letter-spacing:-.5px}
.header .sub{font-size:12px;color:var(--dim);margin-top:3px}
.controls{display:flex;justify-content:center;gap:6px;padding:10px 20px;flex-wrap:wrap}
.btn{background:var(--card);border:1px solid var(--border);color:var(--dim);font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;transition:all .15s;font-family:inherit;font-weight:500}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.on{background:#eff6ff;border-color:var(--blue);color:var(--blue)}
.btn.rst{border-color:#fca5a5;color:var(--red)}
.btn.rst:hover{background:#fef2f2;border-color:var(--red)}
.wrap{display:flex;gap:0;justify-content:center;padding:0 8px}
.svg-box{flex:1;max-width:1520px}
svg{width:100%;height:auto;display:block;background:var(--card);border-radius:14px;border:1px solid var(--border);box-shadow:0 4px 6px -1px rgba(0,0,0,.05), 0 2px 4px -2px rgba(0,0,0,.05)}
.pnl{width:340px;background:var(--card);border-left:1px solid var(--border);padding:12px;font-size:11px;max-height:880px;overflow-y:auto;flex-shrink:0;border-radius:0 14px 14px 0;box-shadow:-4px 0 16px rgba(0,0,0,.02)}
.pnl h3{color:#334155;font-size:11px;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.pnl input{background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:11px;padding:5px 8px;border-radius:5px;width:100%;margin-bottom:6px;outline:none;font-family:inherit;transition:all .15s}
.pnl input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--dim);font-size:10px;padding:3px 4px;border-bottom:1px solid var(--border);font-weight:600;background:var(--bg)}
td{padding:4px 5px;font-size:10px;color:var(--text);border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
tr.hl td{background:#eff6ff!important}
tr:hover td{background:#f8fafc}
.cm{color:var(--blue)}.cv{color:var(--amber)}.cb{color:var(--red);font-weight:700}.ce{color:var(--orange);font-weight:700}.ch{color:var(--green);font-weight:700}
.tip{position:fixed;background:#ffffff;color:var(--text);padding:10px 14px;border-radius:8px;font-size:11px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:99;line-height:1.6;border:1px solid var(--border);box-shadow:0 12px 30px rgba(0,0,0,.15);max-width:360px}
.tip b{color:#0f172a}.tip .dm{color:var(--dim);font-size:10px}
.dev{cursor:pointer;transition:all .15s}.dev:hover{filter:brightness(0.85)}
.dev.dim{opacity:.15;pointer-events:none}
.net{cursor:pointer;transition:all .15s}.net:hover{filter:drop-shadow(0 0 4px rgba(59,130,246,0.6))}
.net.dim{opacity:.1;pointer-events:none}
.wire{transition:opacity .15s}.wire.dim{opacity:.1}
.slbl{transition:opacity .15s;font-weight:600}.slbl.dim{opacity:.1}
.stats{display:flex;gap:6px;justify-content:center;padding:0 20px 6px;flex-wrap:wrap}
.s{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:11.5px;color:var(--dim);box-shadow:0 1px 2px rgba(0,0,0,.02)}
.s b{color:#0f172a;font-size:13px;margin-right:2px;font-weight:700}
</style>
</head>

// ═══════ Direct Wires (PNETLab style: Device ─── Device) ═══════
const wireEls=[];
(()=>{
  const gW=E("g");
  const gL=E("g");
  const fmtPort=(s)=>"Gi0/"+s.replace("e","");

  W.forEach((w,i)=>{
    const da=dm[w.a],db=dm[w.b];
    if(!da||!db)return;
    const col=WC[w.t],scol=NS[w.t];
    const lw=WW[w.t],ld=WD[w.t];

    // Direct line: Device A → Device B
    const wire=E("line",{x1:da.x,y1:da.y,x2:db.x,y2:db.y,stroke:col,"stroke-width":lw,"stroke-linecap":"round",class:"wire","data-i":i,opacity:.55});
    if(ld)wire.setAttribute("stroke-dasharray",ld);
    gW.appendChild(wire);
    wireEls.push({el:wire,w,i});

    // HSRP: extra wire from PE6 to Leaf9 (shared subnet)
    if(w.t==="h" && w.extra){
      const pe6=dm["PE6"];
      if(pe6){
        const wC=E("line",{x1:pe6.x,y1:pe6.y,x2:db.x,y2:db.y,stroke:col,"stroke-width":lw,"stroke-linecap":"round",class:"wire","data-i":i,opacity:.45,"stroke-dasharray":"4,2"});
        gW.appendChild(wC);
      }
    }

    // Port labels near each device (Gi0/X format)
    const dx=db.x-da.x,dy=db.y-da.y,ln=Math.sqrt(dx*dx+dy*dy)||1;
    const ux=dx/ln,uy=dy/ln;
    const pA=da.r==="lf"||da.r==="fw"?22:30, pB=db.r==="lf"||db.r==="fw"?22:30;
    const px=-uy*10,py=ux*10;
    gL.appendChild(TX(da.x+ux*pA+px,da.y+uy*pA+py+3,fmtPort(w.sA),{"text-anchor":"middle",fill:scol,"font-size":"8","font-weight":"600","font-family":"monospace",opacity:.85,class:"sl","data-i":i}));
    gL.appendChild(TX(db.x-ux*pB+px,db.y-uy*pB+py+3,fmtPort(w.sB),{"text-anchor":"middle",fill:scol,"font-size":"8","font-weight":"600","font-family":"monospace",opacity:.85,class:"sl","data-i":i}));

    // Subnet label at midpoint (hidden by default)
    const mx=(da.x+db.x)/2+px,my=(da.y+db.y)/2+py;
    const sbl=TX(mx,my,w.sn,{"text-anchor":"middle",fill:scol,"font-size":"7","font-weight":"600","font-family":"monospace",opacity:.65,class:"sbl","data-i":i});
    sbl.style.display="none";gL.appendChild(sbl);

    // Special annotations
    if(w.t==="h"){
      const amx=(da.x+db.x)/2,amy=(da.y+db.y)/2-14;
      gL.appendChild(TX(amx,amy,"⚡ HSRP Shared",{"text-anchor":"middle",fill:"#7c3aed","font-size":"7","font-weight":"700","font-family":"inherit",opacity:.8}));
    }
    if(w.t==="e"){
      const amx=(da.x+db.x)/2,amy=(da.y+db.y)/2-14;
      gL.appendChild(TX(amx,amy,"eBGP Inter-AS",{"text-anchor":"middle",fill:"#059669","font-size":"7","font-weight":"700","font-family":"inherit",opacity:.7}));
    }

    // Wire tooltip
    wire.style.cursor="pointer";
    wire.addEventListener("mouseenter",ev=>{
      let h=`<b>${w.a}</b> (${fmtPort(w.sA)}) ── <b>${w.b}</b> (${fmtPort(w.sB)})<br><br>`+
        `Subnet: <b>${w.sn}</b><br>`+
        `Type: <b>${TNAME[w.t]}</b>`;
      if(w.extra)h+=`<br><br><span class="dm">${w.extra} also connected (HSRP shared)</span>`;
      sT(h,ev);
    });
    wire.addEventListener("mousemove",ev=>{tip.style.left=ev.clientX+16+"px";tip.style.top=ev.clientY-10+"px"});
    wire.addEventListener("mouseleave",hT);
    wire.addEventListener("click",()=>hlW(i));
  });

  sv.appendChild(gW);
  sv.appendChild(gL);
})();

// ═══════ Device Nodes ═══════
const devEls={};
(()=>{
  D.forEach(d=>{
    const s=DS[d.r];
    const g=E("g",{class:"dev",transform:`translate(${d.x},${d.y})`,"data-id":d.id});

    const gi={p:0,pe:1,lf:2,ab:5,fw:4}[d.r];
    g.appendChild(E("rect",{x:-s.w/2-2,y:-s.h/2-2,width:s.w+4,height:s.h+4,rx:s.rx+2,fill:s.stk,opacity:.05,filter:`url(#g${gi})`}));
    g.appendChild(E("rect",{x:-s.w/2,y:-s.h/2,width:s.w,height:s.h,rx:s.rx,fill:s.fill,stroke:s.stk,"stroke-width":2}));
    g.appendChild(TX(0,1,d.id,{"text-anchor":"middle","dominant-baseline":"middle",fill:s.txt,"font-size":s.fs,"font-weight":"700","font-family":"inherit"}));

    if(d.v){
      const vw=Math.max(d.v.length*5.5+4,44);
      g.appendChild(E("rect",{x:-vw/2,y:s.h/2+3,width:vw,height:13,rx:4,fill:s.stk,opacity:.15}));
      g.appendChild(TX(0,s.h/2+12,d.v,{"text-anchor":"middle",fill:s.stk,"font-size":"7","font-weight":"600","font-family":"inherit"}));
    }
    if(d.r!=="lf"){
      g.appendChild(TX(0,s.h/2+(d.v?26:14),d.m,{"text-anchor":"middle",fill:"#64748b","font-size":"7.5","font-family":"monospace"}));
    }

    const conns=W.filter(w=>w.a===d.id||w.b===d.id||(w.extra&&w.extra.startsWith(d.id)));
    conns.forEach((w)=>{
      const peer=w.a===d.id?dm[w.b]:dm[w.a];
      if(!peer)return;
      const dx=peer.x-d.x,dy=peer.y-d.y,ln=Math.sqrt(dx*dx+dy*dy)||1;
      const px=(dx/ln)*(s.w/2+1),py=(dy/ln)*(s.h/2+1);
      g.appendChild(E("circle",{cx:px,cy:py,r:2.5,fill:NS[w.t],opacity:.7}));
    });

    g.addEventListener("mouseenter",ev=>{
      const cls=W.filter(w=>w.a===d.id||w.b===d.id||(w.extra&&w.extra.startsWith(d.id)));
      const roleNames={p:"P Core Router",pe:"Provider Edge",lf:"Leaf/CE",ab:"ASBR (AS Boundary)",fw:"Firewall Waypoint"};
      let h=`<b>${d.id}</b> <span class="dm">${roleNames[d.r]||d.r} &bull; Region ${d.rg}</span><br>`;
      if(d.lo)h+=`Loopback: <b>${d.lo}</b><br>`;
      h+=`Mgmt: <b>${d.m}</b> (e7 \u2192 Cloud0)<br>`;
      if(d.v)h+=`VRF: <b>${d.v}</b><br>`;
      h+=`<br><span class="dm">PNETLab Connections (${cls.length} data + 1 mgmt):</span><br>`;
      cls.forEach(w=>{
        const isA=w.a===d.id;
        const isExtra=w.extra&&w.extra.startsWith(d.id);
        if(isExtra){
          h+=`&nbsp;\u2022 <b>${w.extra.split("(")[1]?.replace(")","")}</b> \u2192 [${w.net}] \u2192 HSRP shared<br>`;
        } else {
          h+=`&nbsp;\u2022 <b>${isA?w.sA:w.sB}</b> \u2192 [${w.net}] \u2192 ${isA?w.b:w.a}<br>`;
        }
      });
      h+=`&nbsp;\u2022 <b>e7</b> \u2192 [Cloud0] \u2192 Mgmt`;
      sT(h,ev);
    });
    g.addEventListener("mousemove",ev=>{tip.style.left=ev.clientX+16+"px";tip.style.top=ev.clientY-10+"px"});
    g.addEventListener("mouseleave",hT);
    g.addEventListener("click",()=>hlD(d.id));

    devEls[d.id]=g;
    sv.appendChild(g);
  });
})();

// ═══════ HIGHLIGHT ═══════
let hlOn=false;
function hlD(id){
  rstHL();hlOn=true;
  const conn=new Set([id]),ci=new Set();
  W.forEach((w,i)=>{
    if(w.a===id||w.b===id||(w.extra&&w.extra.startsWith(id))){conn.add(w.a);conn.add(w.b);ci.add(i)}
  });
  Object.entries(devEls).forEach(([k,e])=>{if(!conn.has(k))e.classList.add("dim")});
  sv.querySelectorAll(".wire").forEach(e=>{if(!ci.has(+e.dataset.i))e.classList.add("dim")});
  sv.querySelectorAll(".net").forEach(e=>{if(!ci.has(+e.dataset.i))e.classList.add("dim")});
  sv.querySelectorAll(".sl,.sbl,.nl").forEach(e=>{if(!ci.has(+e.dataset.i))e.classList.add("dim")});
  document.querySelectorAll("#tbl tr").forEach(tr=>{if(tr.dataset.i!==undefined&&ci.has(+tr.dataset.i))tr.classList.add("hl")});
}
function hlW(idx){
  rstHL();hlOn=true;
  const w=W[idx],conn=new Set([w.a,w.b]),ci=new Set([idx]);
  Object.entries(devEls).forEach(([k,e])=>{if(!conn.has(k))e.classList.add("dim")});
  sv.querySelectorAll(".wire").forEach(e=>{if(!ci.has(+e.dataset.i))e.classList.add("dim")});
  sv.querySelectorAll(".net").forEach(e=>{if(!ci.has(+e.dataset.i))e.classList.add("dim")});
  sv.querySelectorAll(".sl,.sbl,.nl").forEach(e=>{if(!ci.has(+e.dataset.i))e.classList.add("dim")});
  document.querySelectorAll("#tbl tr").forEach(tr=>{if(tr.dataset.i!==undefined&&ci.has(+tr.dataset.i))tr.classList.add("hl")});
}
function rstHL(){
  hlOn=false;
  sv.querySelectorAll(".dim").forEach(e=>e.classList.remove("dim"));
  document.querySelectorAll("#tbl tr.hl").forEach(e=>e.classList.remove("hl"));
}

// ═══════ TABLE ═══════
function bTbl(q=""){
  const t=document.getElementById("tbl");t.innerHTML="";
  const f=q.toLowerCase();
  if(!f||"cloud0 mgmt e7".includes(f)){
    const r=document.createElement("tr");
    r.innerHTML=`<td style="color:var(--amber)">M</td><td style="color:var(--amber)">Cloud0</td><td colspan=2 style="color:var(--dim)">All 40 \u00d7 e7</td><td style="color:var(--dim)">10.10.10.0/24</td>`;
    t.appendChild(r);
  }
  W.forEach((w,i)=>{
    const s=`${w.n} ${w.net} ${w.a} ${w.b} ${w.sA} ${w.sB} ${w.sn} ${w.t} ${w.extra||""}`.toLowerCase();
    if(f&&!s.includes(f))return;
    const cc={m:"cm",v:"cv",b:"cb",e:"ce",h:"ch"}[w.t]||"cm";
    const r=document.createElement("tr");r.dataset.i=i;
    let col2=`${w.a}(${w.sA})`;
    let col3=`${w.b}(${w.sB})`;
    if(w.extra)col3+=` + ${w.extra}`;
    r.innerHTML=`<td class="${cc}">${w.n}</td><td class="${cc}">${w.net}</td><td>${col2}</td><td>${col3}</td><td style="color:var(--dim)">${w.sn}</td>`;
    r.addEventListener("click",()=>hlW(i));
    t.appendChild(r);
  });
}
bTbl();rVis();
