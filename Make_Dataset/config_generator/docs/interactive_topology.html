<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>PNETLab Interactive Topology</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #header {
      padding: 15px 20px;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      color: #f8fafc;
    }
    p.subtitle {
      margin: 5px 0 0 0;
      font-size: 13px;
      color: #94a3b8;
    }
    #mynetwork {
      flex: 1;
      width: 100%;
      background-color: #0f172a;
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2563eb;
    }
    #infoPanel {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid #334155;
      padding: 15px;
      border-radius: 8px;
      font-size: 12px;
      max-width: 300px;
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>

<div id="header">
  <div>
    <h1>PNETLab Interactive Topology (Lab-B 20 Nodes)</h1>
    <p class="subtitle">마우스로 노드를 자유롭게 드래그하여 원하는 구조로 배치해보세요! (물리 엔진 적용됨)</p>
  </div>
  <div class="controls">
    <button onclick="togglePhysics()">물리 엔진 켜기/끄기</button>
    <button onclick="resetLayout()">기본 정렬로 초기화</button>
  </div>
</div>

<div id="mynetwork"></div>

<div id="infoPanel">
  <strong id="infoTitle" style="color: #60a5fa; font-size: 14px;">Node info</strong><br/>
  <span id="infoContent"></span>
</div>

<script type="text/javascript">
  // ==========================================
  // 1. DATA (Lab-B 20 nodes based)
  // ==========================================
  
  // 스타일 그룹 정의
  const groups = {
    P: {
      shape: 'box',
      color: { background: '#1e3a5f', border: '#60a5fa', hover: { background: '#2563eb'} },
      font: { color: '#93c5fd', size: 16, face: 'Tahoma' },
      borderWidth: 2,
      margin: 10
    },
    PE: {
      shape: 'box',
      color: { background: '#2e1065', border: '#a78bfa', hover: { background: '#6d28d9'} },
      font: { color: '#c4b5fd', size: 16, face: 'Tahoma' },
      borderWidth: 2,
      margin: 12
    },
    LEAF: {
      shape: 'ellipse',
      color: { background: '#451a03', border: '#fbbf24', hover: { background: '#b45309'} },
      font: { color: '#fde68a', size: 14, face: 'Tahoma' },
      borderWidth: 2,
      margin: 8
    }
  };

  // 노드 리스트
  const nodesArr = [
    { id: 1,  label: "P1", group: 'P', title: "OSPF Area 0<br>Loopback: 10.255.0.1<br>Mgmt: 10.10.10.11" },
    { id: 2,  label: "P2", group: 'P', title: "OSPF Area 0<br>Loopback: 10.255.0.2<br>Mgmt: 10.10.10.12" },
    { id: 3,  label: "P3", group: 'P', title: "OSPF Area 0<br>Loopback: 10.255.0.3<br>Mgmt: 10.10.10.13" },
    { id: 4,  label: "P4", group: 'P', title: "OSPF Area 0<br>Loopback: 10.255.0.4<br>Mgmt: 10.10.10.14" },
    { id: 5,  label: "PE1", group: 'PE', title: "MP-BGP AS 65000<br>Loopback: 10.255.0.11<br>Mgmt: 10.10.10.21" },
    { id: 6,  label: "PE2", group: 'PE', title: "MP-BGP AS 65000<br>Loopback: 10.255.0.12<br>Mgmt: 10.10.10.22" },
    { id: 7,  label: "Leaf1", group: 'LEAF', title: "VRF_GOV<br>Mgmt: 10.10.10.31" },
    { id: 8,  label: "Leaf2", group: 'LEAF', title: "VRF_EDU<br>Mgmt: 10.10.10.32" },
    { id: 9,  label: "Leaf3", group: 'LEAF', title: "VRF_RND<br>Mgmt: 10.10.10.33" },
    { id: 10, label: "Leaf4", group: 'LEAF', title: "VRF_GOV<br>Mgmt: 10.10.10.34" },
    { id: 11, label: "P5", group: 'P', title: "OSPF Area 0<br>Loopback: 10.255.0.5<br>Mgmt: 10.10.10.15" },
    { id: 12, label: "P6", group: 'P', title: "OSPF Area 0<br>Loopback: 10.255.0.6<br>Mgmt: 10.10.10.16" },
    { id: 13, label: "P7", group: 'P', title: "OSPF Area 0<br>Loopback: 10.255.0.7<br>Mgmt: 10.10.10.17" },
    { id: 14, label: "P8", group: 'P', title: "OSPF Area 0<br>Loopback: 10.255.0.8<br>Mgmt: 10.10.10.18" },
    { id: 15, label: "PE3", group: 'PE', title: "MP-BGP AS 65000<br>Loopback: 10.255.0.21<br>Mgmt: 10.10.10.23" },
    { id: 16, label: "PE4", group: 'PE', title: "MP-BGP AS 65000<br>Loopback: 10.255.0.22<br>Mgmt: 10.10.10.24" },
    { id: 17, label: "Leaf5", group: 'LEAF', title: "VRF_GOV<br>Mgmt: 10.10.10.35" },
    { id: 18, label: "Leaf6", group: 'LEAF', title: "VRF_EDU<br>Mgmt: 10.10.10.36" },
    { id: 19, label: "Leaf7", group: 'LEAF', title: "VRF_RND<br>Mgmt: 10.10.10.37" },
    { id: 20, label: "Leaf8", group: 'LEAF', title: "VRF_GOV<br>Mgmt: 10.10.10.38" }
  ];
  
  // 헬퍼: 이름으로 ID 찾기
  const nMap = {};
  nodesArr.forEach(n => nMap[n.label] = n.id);

  // 링크 설정
  function l(from, to, type, label="") {
    let color, width, dashes;
    if (type === 'mpls') { color = '#3b82f6'; width = 2; dashes = false; }
    else if (type === 'vrf') { color = '#f59e0b'; width = 1.5; dashes = true; }
    else if (type === 'backbone') { color = '#ef4444'; width = 4; dashes = false; }
    
    return { from: nMap[from], to: nMap[to], color: {color: color}, width: width, dashes: dashes, label: label, font: {align: 'horizontal', size: 10, color: '#94a3b8'} };
  }

  const edgesArr = [
    l("P1","PE1", "mpls", "e0-e0"), l("P1","P2", "mpls"), l("P1","P3", "mpls"),
    l("P2","PE2", "mpls", "e1-e0"), l("P2","P4", "mpls"), l("P3","P4", "mpls"), l("P4","PE2", "mpls"),
    l("PE1","Leaf1", "vrf", "VRF_GOV"), l("PE1","Leaf2", "vrf", "VRF_EDU"),
    l("PE2","Leaf3", "vrf", "VRF_RND"), l("PE2","Leaf4", "vrf", "VRF_GOV"),
    l("P3","P5", "backbone", "Backbone"), // Inter-region
    l("P5","PE3", "mpls"), l("P5","P6", "mpls"), l("P6","PE4", "mpls"),
    l("P6","P7", "mpls"), l("P7","P8", "mpls"), l("P8","PE4", "mpls"),
    l("PE3","Leaf5", "vrf", "VRF_GOV"), l("PE3","Leaf6", "vrf", "VRF_EDU"),
    l("PE4","Leaf7", "vrf", "VRF_RND"), l("PE4","Leaf8", "vrf", "VRF_GOV")
  ];

  // ==========================================
  // 2. NETWORK INITIALIZATION
  // ==========================================
  const container = document.getElementById('mynetwork');
  const data = {
    nodes: new vis.DataSet(nodesArr),
    edges: new vis.DataSet(edgesArr)
  };

  const options = {
    groups: groups,
    layout: {
      randomSeed: 2
    },
    physics: {
      enabled: true,
      barnesHut: {
        gravitationalConstant: -3000,
        centralGravity: 0.1,
        springLength: 150,
        springConstant: 0.04,
        damping: 0.09,
        avoidOverlap: 0.1
      }
    },
    interaction: {
      hover: true,
      tooltipDelay: 200
    }
  };

  let network = new vis.Network(container, data, options);

  // ==========================================
  // 3. UI CONTROLS
  // ==========================================
  let physicsEnabled = true;
  function togglePhysics() {
    physicsEnabled = !physicsEnabled;
    network.setOptions({ physics: { enabled: physicsEnabled } });
  }

  function resetLayout() {
    network.setOptions({ layout: { randomSeed: Math.random() } });
    network.stabilize();
  }

  // 노드 클릭 시 정보 패널 출력
  network.on("click", function (params) {
    const infoPanel = document.getElementById('infoPanel');
    if (params.nodes.length > 0) {
      const nodeId = params.nodes[0];
      const node = data.nodes.get(nodeId);
      document.getElementById('infoTitle').innerText = node.label + " (" + node.group + " Node)";
      document.getElementById('infoContent').innerHTML = node.title;
      infoPanel.style.display = 'block';
    } else {
      infoPanel.style.display = 'none';
    }
  });

  network.on("dragEnd", function() {
    // 드래그가 끝나면 물리엔진이 서서히 노드를 고정시키게 함 (옵션)
  });
</script>
</body>
</html>
